name: CI
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Lint
      run: make lint

    # A zero exit does not prove a binary exists:
    # widened to ./..., go build checks the command and writes nothing.
    # Only the artifact proves it built.
    - name: Build
      run: make build && test -x bin/envrun

    - name: Test and cover
      # We don't need the benchmarks to run for long, just enough for coverage.
      run: mkdir -p coverage; make cover

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
        files: ./coverage/cover.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        verbose: false
        directory: ./coverage
        env_vars: OS

  # A second job rather than a matrix on the one above:
  # Windows runs neither the Makefile's shell recipes nor the race detector,
  # and reports no coverage, so a matrix would be conditionals in every step.
  # What it must prove is narrower —
  # that the platform still builds and still runs a command.
  # The transparency v0.2.0 adds is *nix-only (ADR-001),
  # and Windows keeps the supervising path,
  # which until now had no runner to catch a regression in.
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Build
      run: go build ./...

    # Without -race:
    # the detector needs a C toolchain,
    # which is a heavier dependency than this job's purpose justifies.
    # The *nix job runs it.
    - name: Test
      run: go test ./...
