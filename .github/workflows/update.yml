name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 6" # 2am UTC every Saturday; first-Saturday check is in the job condition

permissions:
  contents: read

jobs:
  check-schedule:
    uses: ./.github/workflows/check-first-week.yml

  dep_update:
    needs: check-schedule
    if: github.event_name != 'schedule' || needs.check-schedule.outputs.is-first-week == 'true'
    permissions:
      contents: write  # for peter-evans/create-pull-request to create branch
      pull-requests: write  # for peter-evans/create-pull-request to create a PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Update minor and patch-level dependencies
        run: |
          # "./..." matches only packages in the main module, which never
          # imports the tools, so tool dependencies need their own pattern.
          go get -t -u ./...
          go get -u tool

      - name: Tidy
        run: go mod tidy

      # GoReleaser is pinned in .tool-versions, which neither `go get -u`
      # above nor Dependabot's github-actions group can reach: one sees only
      # go.mod, the other only `uses:` refs. This step is what keeps that pin
      # moving with the rest.
      - name: Update the pinned GoReleaser
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api repos/goreleaser/goreleaser/releases/latest -q .tag_name)
          [ -n "$latest" ] || { echo "no GoReleaser release found"; exit 1; }
          sed -i "s/^goreleaser .*/goreleaser ${latest#v}/" .tool-versions
          grep '^goreleaser ' .tool-versions

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "Update package dependencies + tidy"
          body: |
            This is a change initiated automatically on a monthly basis by a
            GitHub Action that updates the projects dependencies to their latest
            minor and patch-level versions. This lets us stay up to date
            incrementally so that updates are less effort to get merged compared
            to large monolithic updates, and gets us security updates more
            expediently.

            If the build passes, you are probably A-OK to merge and deploy this.
            If not, try to dig into what's not working and see if you can fix it
            so that the dep train stays on its rails.

            Note that although minor/patch level changes are handled
            automatically, notably major version changes like you'd find in
            stripe-go are not and those upgrades need to be performed manually.
            That should theoretically not be a problem if fixes are backported
            to all previous majors, but in practice they are often not, so it's
            worthwhile to occasionally look for new majors and integrate them.
          branch: "dep-update"
          commit-message: |
            Update package dependencies + tidy

            Monthly update to the project's package dependencies initiated by an
            automatic GitHub Action running on cron. Keeps upgrades less of a
            monolithic task and lets security-related patches trickle in more
            quickly.
          author: "OSInet Support Bot <support@osinet.fr>"
          committer: "OSInet Support Bot <support@osinet.fr>"
          delete-branch: true
          reviewers: |
            fgm
